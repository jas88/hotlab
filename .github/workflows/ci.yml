name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede outdated PR runs; let every main and tag build finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      deb: ${{ steps.version.outputs.deb }}
      assembly: ${{ steps.version.outputs.assembly }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        name: Compute version
        shell: bash
        run: |
          # Tag v1.2.3 -> 1.2.3; v1.2.3-rc.1 -> 1.2.3~rc.1 (sorts before 1.2.3 in Debian).
          # Other builds: 0.0.0~ci<run>+g<sha>, which sorts before any release.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF_NAME#v}
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]"
              exit 1
            fi
            assembly=${tag%%-*}
            deb=${tag/-/\~}
            prerelease=$([[ "$tag" == *-* ]] && echo true || echo false)
          else
            assembly=0.0.0
            deb="0.0.0~ci${GITHUB_RUN_NUMBER}+g${GITHUB_SHA::7}"
            prerelease=false
          fi
          {
            echo "deb=$deb"
            echo "assembly=$assembly"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Package version $deb (assembly $assembly)"

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore Hotlab.slnx
      - name: Build
        run: dotnet build Hotlab.slnx -c Release --no-restore
      - name: Test
        run: >-
          dotnet test Hotlab.slnx -c Release --no-build
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  package:
    needs: [version, build-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: amd64
          - rid: linux-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.rid }}-
      # Self-contained single file with ReadyToRun (faster start for the CLI verbs). Not
      # trimmed: configuration binding and System.Text.Json use reflection (IL2026/IL2091).
      - name: Publish ${{ matrix.rid }}
        env:
          RID: ${{ matrix.rid }}
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assembly }}
          DEB_VERSION: ${{ needs.version.outputs.deb }}
        run: >-
          dotnet publish src/Hotlab.Gateway/Hotlab.Gateway.csproj -c Release
          -r "$RID" --self-contained
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none
          -p:Version="$ASSEMBLY_VERSION" -p:InformationalVersion="$DEB_VERSION"
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o "out/publish-$RID"
      - name: Build .deb
        env:
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
          DEB_VERSION: ${{ needs.version.outputs.deb }}
        run: scripts/build-deb.sh --version "$DEB_VERSION" --arch "$ARCH" --publish-dir "out/publish-$RID" --out-dir out/deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: out/deb/*.deb
          if-no-files-found: error

  check-deb:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: out/deb
      - name: Install and check on Debian ${{ matrix.debian }} (${{ matrix.arch }})
        env:
          DEBIAN: ${{ matrix.debian }}
        run: |
          deb=$(ls out/deb/*.deb)
          docker run --rm -v "$PWD:/work:ro" -w /work "debian:$DEBIAN" scripts/check-deb.sh "$deb"

  source:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source tarball
        env:
          DEB_VERSION: ${{ needs.version.outputs.deb }}
        run: |
          mkdir -p out/src
          git archive --format=tar.gz --prefix="hotlab-$DEB_VERSION/" \
            -o "out/src/hotlab-$DEB_VERSION.tar.gz" HEAD
          tar -tzf "out/src/hotlab-$DEB_VERSION.tar.gz" | head -n 20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: out/src/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, package, check-deb, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{deb-*,source}'
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
